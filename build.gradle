plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '8.3.9'
}

group = 'com.maxipalacios'
version = '0.1.0'

repositories {
    mavenCentral()
}

ext {
    flinkVersion = '1.20.5'
}

dependencies {
    // Flink core is provided by the cluster at runtime, so it must not be packaged.
    compileOnly "org.apache.flink:flink-streaming-java:${flinkVersion}"
    compileOnly "org.apache.flink:flink-clients:${flinkVersion}"
    compileOnly "org.apache.flink:flink-table-api-java-bridge:${flinkVersion}"

    implementation 'org.apache.flink:flink-sql-connector-postgres-cdc:3.6.0-1.20'
    implementation 'org.apache.flink:flink-connector-jdbc:3.3.0-1.20'
    implementation 'org.postgresql:postgresql:42.7.7'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    // Same Flink jars the cluster provides (the dist ships the table API uber
    // jar, the planner loader and the table runtime); needed here to run the
    // job in-process on the mini-cluster inside the e2e tests.
    testImplementation "org.apache.flink:flink-streaming-java:${flinkVersion}"
    testImplementation "org.apache.flink:flink-clients:${flinkVersion}"
    testImplementation "org.apache.flink:flink-table-api-java-bridge:${flinkVersion}"
    testImplementation "org.apache.flink:flink-table-runtime:${flinkVersion}"
    testImplementation "org.apache.flink:flink-table-planner-loader:${flinkVersion}"

    testImplementation 'org.testcontainers:testcontainers:1.21.3'
    testImplementation 'org.testcontainers:postgresql:1.21.3'
    testImplementation 'org.awaitility:awaitility:4.3.0'

    testRuntimeOnly 'org.apache.logging.log4j:log4j-core:2.24.3'
    testRuntimeOnly 'org.apache.logging.log4j:log4j-slf4j-impl:2.24.3'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    mainClass = 'com.maxipalacios.taxes.TaxJob'
}

// Flink discovers table factories via META-INF/services and several connector
// jars register under the same service file; merging keeps every entry.
shadowJar {
    archiveClassifier = 'all'
    mergeServiceFiles()
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
}

// Make plain `gradle build` produce the fat JAR.
assemble.dependsOn shadowJar

test {
    useJUnitPlatform()
}
