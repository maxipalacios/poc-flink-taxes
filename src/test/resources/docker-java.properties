# docker-java (shaded inside testcontainers 1.21.3) defaults to Docker Engine
# API version 1.32 and Testcontainers' DockerClientProviderStrategy pins that
# default whenever no explicit version is configured. Docker Engine 29+ rejects
# API < 1.40 ("client version 1.32 is too old"), which made every Testcontainers
# startup fail with "Could not find a valid Docker environment" inside the
# test-runner container. This file is picked up from the test classpath root
# (docker-java loads /docker-java.properties before falling back to the 1.32
# pin) and negotiates API 1.44, supported by every Docker Engine >= 25.
#
# Remove this file if the Testcontainers dependency is ever upgraded to a
# version that raises its default API version on its own.
api.version=1.44
