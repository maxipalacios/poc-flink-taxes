services:
  dev:
    build: &dev-build
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    volumes:
      - .:/workspace:cached
      # The e2e tests spin up ephemeral PostgreSQL containers through
      # Testcontainers; that needs the host Docker socket.
      - /var/run/docker.sock:/var/run/docker.sock
      # Persists Gradle dependency downloads across one-off `compose run` containers.
      - gradle-cache:/home/vscode/.gradle
    # Lets the socket-mounted dev container talk to the host Docker daemon;
    # override with DOCKER_SOCKET_GID if the host's docker group id differs.
    group_add:
      - "${DOCKER_SOCKET_GID:-983}"
    depends_on:
      - jobmanager
      - taskmanager
      - postgres-source
      - postgres-target
    networks:
      - flink

  # One-off runner for Gradle tasks that need Docker (the Testcontainers-based
  # e2e tests). Host networking lets the in-container JVM reach the ports of
  # the sibling containers Testcontainers creates through the mounted socket.
  #   docker compose run --rm test-runner bash -lc 'cd /workspace && gradle --no-daemon test'
  test-runner:
    build: *dev-build
    command: sleep infinity
    network_mode: host
    volumes:
      - .:/workspace:cached
      - /var/run/docker.sock:/var/run/docker.sock
      - gradle-cache:/home/vscode/.gradle
    group_add:
      - "${DOCKER_SOCKET_GID:-983}"

  jobmanager:
    image: flink:1.20.5-java17
    command: jobmanager
    # Host ports bind to loopback only: the Flink REST/UI allows JAR upload
    # (an RCE surface) and must not listen on every interface. The devcontainer
    # reaches the services through the compose `flink` network, so nothing
    # needs a LAN-reachable binding.
    ports:
      - "127.0.0.1:8081:8081"
    # PoC guard rails, not production sizing: keep a runaway container from
    # starving the host. `dev`/`test-runner` stay unlimited on purpose (Gradle
    # builds and Testcontainers need headroom).
    mem_limit: 2g
    pids_limit: 512
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        state.checkpoints.dir: file:///opt/flink/checkpoints
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
      - ./build/libs:/opt/flink/usrlib
    networks:
      - flink

  taskmanager:
    image: flink:1.20.5-java17
    command: taskmanager
    depends_on:
      - jobmanager
    # Same PoC guard rails; the default taskmanager process size is 1728m.
    mem_limit: 2g
    pids_limit: 512
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
        state.checkpoints.dir: file:///opt/flink/checkpoints
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    networks:
      - flink

  postgres-source:
    image: postgres:17
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    environment:
      POSTGRES_DB: taxes
      POSTGRES_USER: flink
      POSTGRES_PASSWORD: flink
    ports:
      - "127.0.0.1:5432:5432"
    # PoC guard rails, not production sizing.
    mem_limit: 512m
    pids_limit: 256
    volumes:
      - postgres-source-data:/var/lib/postgresql/data
      - ./docker/postgres/source/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flink -d taxes"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - flink

  postgres-target:
    image: postgres:17
    environment:
      POSTGRES_DB: taxes
      POSTGRES_USER: flink
      POSTGRES_PASSWORD: flink
    ports:
      - "127.0.0.1:5433:5432"
    # PoC guard rails, not production sizing.
    mem_limit: 512m
    pids_limit: 256
    volumes:
      - postgres-target-data:/var/lib/postgresql/data
      - ./docker/postgres/target/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flink -d taxes"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - flink

networks:
  flink:

volumes:
  flink-checkpoints:
  postgres-source-data:
  postgres-target-data:
  gradle-cache:
